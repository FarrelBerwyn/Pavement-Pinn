idth="1.3"  marker-end="url(#a5)"/><text x="10" y="292" font-size="9.6" fill="#5C677D" font-weight="400" text-anchor="start">Not present: Python service, PyMastic/MLET, trained model of any kind, OpenVINO runtime, NPU use, benchmarks,</text><text x="10" y="306" font-size="9.6" fill="#5C677D" font-weight="400" text-anchor="start">EXIF stripping, face/plate blur, tracking code, service worker. Green = keep; red = replace/remove; amber = replace (D-10).</text></svg>