<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314" width="680" height="314" font-family="Segoe UI, Arial, sans-serif"><rect x="10" y="6" width="112.8" height="16" rx="2" fill="#fff" stroke="#6941C6"/><text x="16" y="17.5" font-size="8.6" fill="#6941C6" font-weight="700" text-anchor="start">V3 SPECIFICATION</text><rect x="140" y="6" width="144.29999999999998" height="16" rx="2" fill="#fff" stroke="#0B2545"/><text x="146" y="17.5" font-size="8.6" fill="#0B2545" font-weight="700" text-anchor="start">PROPOSED TARGET STATE</text><rect x="10" y="34" width="660" height="50" rx="5" fill="#fff" stroke="#13315C" stroke-width="1.2" /><text x="18" y="50" font-size="11.5" fill="#0B2545" font-weight="700" text-anchor="start">Layer 1 — Citizen PWA (online; reports queue offline)</text><text x="18" y="66" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">Camera + GPS, on-phone blur/brightness check, compression &lt;= 500 KB, tracking code, public hazard map without reporter data, confirmations</text><rect x="10" y="104" width="300" height="96" rx="5" fill="#fff" stroke="#067647" stroke-width="1.8" /><text x="18" y="120" font-size="11.5" fill="#0B2545" font-weight="700" text-anchor="start">Express API — existing, kept</text><text x="18" y="136" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">State machine + RBAC + audit (only writer of case state)</text><text x="18" y="149.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">New states after approval: SCREENED, REJECTED_WITH_</text><text x="18" y="163" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">REASON, MERGED, REFERRED; risk score + knapsack</text><text x="18" y="176.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">(TypeScript); calls inference via INFERENCE_URL</text><rect x="350" y="104" width="320" height="182" rx="5" fill="#fff" stroke="#6941C6" stroke-width="1.8" stroke-dasharray="5 3"/><text x="358" y="120" font-size="11.5" fill="#0B2545" font-weight="700" text-anchor="start">Python inference service (FastAPI, :8100) — NEW</text><text x="358" y="136" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">/v1/screen  A Trust Gate · B EXIF strip + blur · C YOLO INT8</text><text x="358" y="149.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">/v1/assess  D1 PyMastic MLET (reference)</text><text x="358" y="163" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">            D2 PI-surrogate (OpenVINO) + guard:</text><text x="358" y="176.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">               out of domain or &gt; 10 % cross-check -&gt; MLET</text><text x="358" y="190" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">            D3 transfer function + Monte Carlo P10/P50/P90</text><text x="358" y="203.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">/v1/options repair-option comparison</text><text x="358" y="217" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">/v1/brief   G local SLM (NPU -&gt; GPU -&gt; CPU) + checker</text><text x="358" y="230.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">/v1/measurements  benchmark files (Evidence page)</text><text x="358" y="244" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">Stateless w.r.t. cases; outputs carry provenance</text><rect x="10" y="220" width="300" height="66" rx="5" fill="#fff" stroke="#13315C" stroke-width="1.2" /><text x="18" y="236" font-size="11.5" fill="#0B2545" font-weight="700" text-anchor="start">Layer 3 — decisions and governance</text><text x="18" y="252" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">Operator triage, engineer assessment (offline field mode),</text><text x="18" y="265.5" font-size="9.6" fill="#344054" font-weight="400" text-anchor="start">planner budget package, Dishub advisory (read-only)</text><defs><marker id="a6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5C677D"/></marker></defs><line x1="160" y1="84" x2="160" y2="104" stroke="#5C677D" stroke-width="1.3"  marker-end="url(#a6)"/><defs><marker id="a7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5C677D"/></marker></defs><line x1="310" y1="150" x2="350" y2="150" stroke="#5C677D" stroke-width="1.3"  marker-end="url(#a7)"/><defs><marker id="a8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5C677D"/></marker></defs><line x1="160" y1="200" x2="160" y2="220" stroke="#5C677D" stroke-width="1.3"  marker-end="url(#a8)"/><text x="10" y="304" font-size="9.6" fill="#B42318" font-weight="400" text-anchor="start">Blocked today: no permitted Python runtime on the development laptop (F-38); licence decision for YOLO (F-42).</text></svg>