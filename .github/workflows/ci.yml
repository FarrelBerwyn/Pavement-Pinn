name: CI

# Runs on pull requests and on pushes to any branch except gh-pages. It fails the build
# when typecheck, tests or the production build fail; nothing here is mocked.
on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit, integration and physics tests
        run: npm test

      - name: Production build (SPA + server bundle)
        run: npm run build
