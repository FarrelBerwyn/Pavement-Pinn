name: Deploy to GitHub Pages

# Static demo build (frontend only; the offline demo gateway runs in the browser).
# Only `main` deploys; ci.yml checks every branch (main included) without publishing.
# The Express API is not hosted here: see docs/DEPLOYMENT_ARCHITECTURE.md (Vercel upgrade path).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile)
        run: npm ci
      - name: Build static site
        env:
          # Project Pages live under /<repository name>/; the app reads its base from the build.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build
      - name: Stamp the build with its revision
        run: |
          printf '{"app":"pavement-pinn","target":"github-pages-static","commit":"%s","ref":"%s","builtAt":"%s","runId":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > dist/version.json
          touch dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
